<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastClicker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-panel">
      <h1 class="game-title">FastClicker</h1>
      <p class="game-subtitle">Clique le plus possible avant la fin du chrono.</p>

      <div class="stat-row">
        <div class="score-pill">
          <span class="pill-label">Score</span>
          <span class="pill-value" id="score-value">0</span>
        </div>
        <div class="timer-pill">
          <span class="pill-label">Temps</span>
          <span class="pill-value" id="timer-value">5</span>
        </div>
      </div>

      <button class="click-button" id="click-button" type="button">Clique !</button>

      <p class="status-band" id="status-band">Appuie sur le bouton pour lancer la partie.</p>
    </main>

    <dialog class="score-modal" id="score-modal">
      <h2 class="modal-title">Fini !</h2>
      <p class="modal-score"><span id="modal-score-value">0</span> clics en 5 secondes</p>

      <form class="name-form" id="name-form">
        <input
          class="name-field"
          id="name-field"
          type="text"
          maxlength="32"
          required
          placeholder="Ton pseudo"
          autocomplete="off"
        />
        <button class="send-button" type="submit">Envoyer</button>
      </form>

      <p class="form-error" id="form-error" hidden></p>

      <ol class="score-board" id="score-board" hidden></ol>

      <button class="replay-button" id="replay-button" type="button">Rejouer</button>
    </dialog>

    <script type="module" src="script.js"></script>
  </body>
</html>
