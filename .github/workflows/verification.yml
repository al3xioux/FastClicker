# Bloc de vérification, appelé par verify.yml (sur pull request) et par
# release.yml (sur push vers main). Il ne publie rien et n'a aucun déclencheur
# propre : c'est ce qui garantit qu'une pull request ne peut pas publier, même
# par accident.
name: Vérification

on:
  workflow_call:

jobs:
  # --- stage lint ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Installer ESLint
        run: npm ci

      - name: Vérifier le style de tout le JS du dépôt
        run: npm run lint

  # --- stage test ----------------------------------------------------------
  test-frontend:
    name: Tests du jeu
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lancer les tests
        working-directory: frontend
        run: npm test

  test-scores-api:
    name: Tests de l'API des scores
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scores-api/package-lock.json

      - name: Installer les dépendances
        working-directory: scores-api
        run: npm ci

      - name: Lancer les tests
        working-directory: scores-api
        run: npm test

  test-stats-api:
    name: Tests du service de stats
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      # Même version que celle épinglée dans stats_api/Dockerfile
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: stats_api/requirements-dev.txt

      - name: Installer les dépendances
        working-directory: stats_api
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        working-directory: stats_api
        run: python -m pytest -q

  # --- stage sécurité ------------------------------------------------------
  # Sans `needs:` : rien n'empêche de vérifier les dépendances et l'historique
  # pendant que le lint et les tests tournent.
  security-deps:
    name: Sécurité - dépendances et secrets
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 est indispensable : gitleaks relit des commits, or un
      # checkout par défaut n'en ramène qu'un seul.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Seuil du cours : on bloque sur high et critical, le reste passe.
      - name: Auditer les dépendances du dépôt
        run: npm audit --audit-level=high

      - name: Auditer les dépendances du jeu
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Auditer les dépendances de l'API des scores
        working-directory: scores-api
        run: npm audit --audit-level=high

      - name: Chercher des secrets dans l'historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- stage build de vérification ----------------------------------------
  # Construit les trois images sans rien publier : on veut savoir que ça build,
  # y compris sur une pull request.
  images:
    name: Build des images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-scores-api, test-stats-api]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du jeu
        run: docker build --tag fastclicker-game:ci .

      - name: Construire l'image de l'API des scores
        run: docker build --tag fastclicker-scores-api:ci scores-api

      - name: Construire l'image du service de stats
        run: docker build --tag fastclicker-stats-api:ci stats_api

      # Le site ne doit contenir que ce qui est servi au navigateur.
      - name: Vérifier que l'image du jeu ne contient pas l'outillage de test
        run: |
          contenu=$(docker run --rm --entrypoint sh fastclicker-game:ci -c "ls -A /usr/share/nginx/html")
          echo "$contenu"
          if echo "$contenu" | grep -qE "package.json|tests|node_modules"; then
            echo "::error::l'image du jeu embarque des fichiers de test"
            exit 1
          fi
