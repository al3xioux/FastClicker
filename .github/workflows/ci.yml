# Pipeline écrite à la main, stage par stage. L'ordre est explicite : rien ne
# teste avant que le style soit propre, rien ne se construit avant que les tests
# passent. Chaque dépendance est un `needs:`, jamais un ordre implicite.
name: CI

env:
  # Un seul endroit à changer si le dépôt d'image change.
  IMAGE_NAME: alexioux/fastclicker

on:
  push:
    branches: ["main", "J2", "J3"]
  pull_request:
    branches: ["main"]

jobs:
  # --- stage lint ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer ESLint
        run: npm ci

      - name: Vérifier le style de tout le JS du dépôt
        run: npm run lint

  # --- stage test ----------------------------------------------------------
  # Les trois suites attendent le lint, puis tournent en parallèle entre elles.
  test-frontend:
    name: Tests du jeu
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lancer les tests
        working-directory: frontend
        run: npm test

  test-scores-api:
    name: Tests de l'API des scores
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: scores-api
        run: npm ci

      - name: Lancer les tests
        working-directory: scores-api
        run: npm test

  test-stats-api:
    name: Tests du service de stats
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      # Même version que celle épinglée dans stats_api/Dockerfile
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: stats_api
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        working-directory: stats_api
        run: python -m pytest -q

  # --- stage build ---------------------------------------------------------
  # Construction de vérification : tourne partout, y compris sur pull request,
  # et ne publie rien.
  images:
    name: Build des images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-scores-api, test-stats-api]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du jeu
        run: docker build --tag fastclicker-game:ci .

      - name: Construire l'image de l'API des scores
        run: docker build --tag fastclicker-scores-api:ci scores-api

      - name: Construire l'image du service de stats
        run: docker build --tag fastclicker-stats-api:ci stats_api

      # Le site ne doit contenir que ce qui est servi au navigateur.
      - name: Vérifier que l'image du jeu ne contient pas l'outillage de test
        run: |
          contenu=$(docker run --rm --entrypoint sh fastclicker-game:ci -c "ls -A /usr/share/nginx/html")
          echo "$contenu"
          if echo "$contenu" | grep -qE "package.json|tests|node_modules"; then
            echo "::error::l'image du jeu embarque des fichiers de test"
            exit 1
          fi

  # --- stage push ----------------------------------------------------------
  # Publication du seul artefact promu : l'image du jeu, taguée au sha du commit.
  # Restreinte à un push sur main : une pull request vérifie, elle ne publie pas.
  build-and-push:
    name: Publier l'image du jeu
    runs-on: ubuntu-latest
    needs: [test-frontend, test-scores-api, test-stats-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # Les identifiants ne sont jamais dans le YAML : ils viennent des secrets
      # du dépôt, réglages > Secrets and variables > Actions.
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Le tag est le sha du commit : on sait toujours quel code tourne derrière
      # quelle image, et deux runs ne peuvent pas produire le même tag.
      - name: Construire et publier
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Rappeler ce qui a été publié
        run: |
          echo "image : ${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "digest : ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
