# Pipeline écrite à la main, stage par stage. L'ordre est explicite : rien ne
# teste avant que le style soit propre, rien ne se construit avant que les tests
# passent. Chaque dépendance est un `needs:`, jamais un ordre implicite.
name: CI

env:
  # Un seul endroit à changer si le dépôt d'image change.
  IMAGE_NAME: alexioux/fastclicker

on:
  push:
    branches: ["main", "J2", "J3"]
  pull_request:
    branches: ["main"]
  # Lancement à la main : c'est le seul mode où gitleaks-action relit tout le
  # dépôt au lieu de la seule plage de commits poussés (voir journal, phase 4).
  workflow_dispatch:

jobs:
  # --- stage lint ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Installer ESLint
        run: npm ci

      - name: Vérifier le style de tout le JS du dépôt
        run: npm run lint

  # --- stage test ----------------------------------------------------------
  # Les trois suites attendent le lint, puis tournent en parallèle entre elles.
  test-frontend:
    name: Tests du jeu
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lancer les tests
        working-directory: frontend
        run: npm test

  test-scores-api:
    name: Tests de l'API des scores
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scores-api/package-lock.json

      - name: Installer les dépendances
        working-directory: scores-api
        run: npm ci

      - name: Lancer les tests
        working-directory: scores-api
        run: npm test

  test-stats-api:
    name: Tests du service de stats
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      # Même version que celle épinglée dans stats_api/Dockerfile
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: stats_api/requirements-dev.txt

      - name: Installer les dépendances
        working-directory: stats_api
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        working-directory: stats_api
        run: python -m pytest -q

  # --- stage sécurité ------------------------------------------------------
  # Sans `needs:` : rien n'empêche de vérifier les dépendances et l'historique
  # pendant que le lint et les tests tournent. Un scanner rouge n'est pas un job
  # cassé, c'est un job qui a fait son travail.
  security-deps:
    name: Sécurité - dépendances et secrets
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 est indispensable ici : gitleaks relit tout l'historique,
      # or un checkout par défaut ne récupère qu'un seul commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Seuil du cours : on bloque sur high et critical, le reste passe.
      - name: Auditer les dépendances du dépôt
        run: npm audit --audit-level=high

      - name: Auditer les dépendances du jeu
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Auditer les dépendances de l'API des scores
        working-directory: scores-api
        run: npm audit --audit-level=high

      - name: Chercher des secrets dans tout l'historique
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- stage build ---------------------------------------------------------
  # Construction de vérification : tourne partout, y compris sur pull request,
  # et ne publie rien.
  images:
    name: Build des images
    runs-on: ubuntu-latest
    needs: [test-frontend, test-scores-api, test-stats-api]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du jeu
        run: docker build --tag fastclicker-game:ci .

      - name: Construire l'image de l'API des scores
        run: docker build --tag fastclicker-scores-api:ci scores-api

      - name: Construire l'image du service de stats
        run: docker build --tag fastclicker-stats-api:ci stats_api

      # Le site ne doit contenir que ce qui est servi au navigateur.
      - name: Vérifier que l'image du jeu ne contient pas l'outillage de test
        run: |
          contenu=$(docker run --rm --entrypoint sh fastclicker-game:ci -c "ls -A /usr/share/nginx/html")
          echo "$contenu"
          if echo "$contenu" | grep -qE "package.json|tests|node_modules"; then
            echo "::error::l'image du jeu embarque des fichiers de test"
            exit 1
          fi

  # --- stage push ----------------------------------------------------------
  # Publication du seul artefact promu : l'image du jeu, taguée au sha du commit.
  # Restreinte à un push sur main : une pull request vérifie, elle ne publie pas.
  build-and-push:
    name: Publier l'image du jeu
    runs-on: ubuntu-latest
    needs: [test-frontend, test-scores-api, test-stats-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # Les identifiants ne sont jamais dans le YAML : ils viennent des secrets
      # du dépôt, réglages > Secrets and variables > Actions.
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Le tag est le sha du commit : on sait toujours quel code tourne derrière
      # quelle image, et deux runs ne peuvent pas produire le même tag.
      - name: Construire et publier
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Rappeler ce qui a été publié
        run: |
          echo "image : ${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "digest : ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # --- stage sécurité de l'image ------------------------------------------
  # npm audit regarde le code de l'application ; il ne voit rien de nginx ni des
  # paquets système de l'image. C'est la question du container scanning.
  security-image:
    name: Sécurité - image publiée
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # `needs:` garantit déjà l'ordre, mais un tag absent doit échouer avec un
      # message clair plutôt que de faire planter Trivy sur une erreur obscure.
      - name: Vérifier que le tag existe bien sur Docker Hub
        run: |
          if ! docker manifest inspect "${{ env.IMAGE_NAME }}:${{ github.sha }}" > /dev/null 2>&1; then
            echo "::error::l'image ${{ env.IMAGE_NAME }}:${{ github.sha }} est introuvable sur Docker Hub"
            exit 1
          fi
          echo "image trouvée : ${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Deux passages : le premier produit le rapport lu par le résumé de la
      # phase 7, le second décide de bloquer. Un seul passage bloquant ne
      # laisserait aucune trace exploitable quand il échoue.
      - name: Scanner l'image (rapport)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: json
          output: trivy-rapport.json
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Conserver le rapport
        uses: actions/upload-artifact@v4
        with:
          name: rapport-trivy
          path: trivy-rapport.json

      # Même seuil que npm audit en phase 4 : on bloque sur HIGH et CRITICAL.
      - name: Bloquer si des CVE HIGH ou CRITICAL sont présentes
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # --- stage inventaire ----------------------------------------------------
  # Trivy répond "y a-t-il un problème connu ?". Le SBOM répond à la question
  # voisine : "qu'est-ce qu'il y a exactement dans ce qu'on publie ?", celle qui
  # compte le jour où une faille touche une bibliothèque très répandue.
  sbom:
    name: Inventaire - SBOM de l'image
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Générer le SBOM au format CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-clickfast.cyclonedx.json
          upload-artifact: false

      # Un SBOM vide passerait inaperçu : on compte les composants avant de le
      # publier comme artefact.
      - name: Vérifier que l'inventaire n'est pas vide
        run: |
          composants=$(jq '.components | length' sbom-clickfast.cyclonedx.json)
          echo "composants inventoriés : $composants"
          if [ "$composants" -eq 0 ]; then
            echo "::error::le SBOM ne contient aucun composant"
            exit 1
          fi

      - name: Publier le SBOM comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-clickfast.cyclonedx.json

  # --- stage résumé --------------------------------------------------------
  # Quatre jobs, quatre logs à ouvrir avant de savoir si on peut publier
  # tranquille : ça ne passe pas à l'échelle. Ce job répond en une lecture.
  resume-securite:
    name: Résumé de sécurité
    runs-on: ubuntu-latest
    needs: [security-deps, build-and-push, security-image, sbom]
    # Sans always(), ce job serait sauté dès qu'un des quatre échoue - donc
    # précisément quand son résumé est le plus utile.
    if: always()

    steps:
      # Les artefacts peuvent ne pas exister (job sauté sur une pull request, ou
      # planté avant de les produire). L'absence est un cas normal, pas une
      # erreur : on continue et on écrira "non disponible".
      - name: Récupérer le rapport Trivy s'il existe
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rapport-trivy

      - name: Récupérer le SBOM s'il existe
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sbom-cyclonedx

      - name: Écrire le résumé
        env:
          RESULTAT_DEPS: ${{ needs.security-deps.result }}
          RESULTAT_PUBLICATION: ${{ needs.build-and-push.result }}
          RESULTAT_IMAGE: ${{ needs.security-image.result }}
          RESULTAT_SBOM: ${{ needs.sbom.result }}
        run: |
          # Traduit un résultat de job en verdict lisible. Un job sauté n'est pas
          # un échec : sur une pull request, il n'y a simplement pas d'image.
          verdict() {
            case "$1" in
              success)  echo "✅ passé" ;;
              failure)  echo "❌ bloqué" ;;
              skipped)  echo "⏭️ non applicable ici" ;;
              cancelled) echo "⚪ annulé" ;;
              *)        echo "❔ inconnu ($1)" ;;
            esac
          }

          # Ne compte que si le fichier est là ET lisible : jamais de valeur
          # inventée quand le job qui devait le produire a planté.
          compte_cve() {
            if [ -f trivy-rapport.json ] && jq -e . trivy-rapport.json > /dev/null 2>&1; then
              jq --arg niveau "$1" \
                '[.Results[]?.Vulnerabilities[]? | select(.Severity == $niveau)] | length' \
                trivy-rapport.json
            else
              echo "non disponible"
            fi
          }

          composants="non disponible"
          if [ -f sbom-clickfast.cyclonedx.json ] \
             && jq -e . sbom-clickfast.cyclonedx.json > /dev/null 2>&1; then
            composants=$(jq '.components | length' sbom-clickfast.cyclonedx.json)
          fi

          {
            echo "## Peut-on publier cette version en confiance ?"
            echo
            echo "Commit \`${GITHUB_SHA:0:7}\` sur \`${GITHUB_REF_NAME}\`."
            echo
            echo "| Vérification | Question posée | Verdict |"
            echo "| --- | --- | --- |"
            echo "| Dépendances et secrets | CVE connue dans nos paquets, identifiant dans l'historique ? | $(verdict "$RESULTAT_DEPS") |"
            echo "| Publication de l'image | l'artefact est-il bien parti, tagué au sha ? | $(verdict "$RESULTAT_PUBLICATION") |"
            echo "| Image publiée | faille dans nginx ou les paquets système ? | $(verdict "$RESULTAT_IMAGE") |"
            echo "| Inventaire | sait-on ce qu'il y a dedans ? | $(verdict "$RESULTAT_SBOM") |"
            echo
            echo "### Détail"
            echo
            echo "| Mesure | Valeur |"
            echo "| --- | --- |"
            echo "| CVE CRITICAL sur l'image | $(compte_cve CRITICAL) |"
            echo "| CVE HIGH sur l'image | $(compte_cve HIGH) |"
            echo "| Composants dans le SBOM | $composants |"
            echo
            echo "Seuil de blocage : HIGH et CRITICAL, identique pour npm audit et Trivy."
            echo "Les lignes \"non disponible\" signalent un rapport absent, jamais un zéro supposé."
          } >> "$GITHUB_STEP_SUMMARY"
