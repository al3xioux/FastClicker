# Chaque brique du projet est testée dans son propre job : un échec désigne
# tout de suite le service fautif. Aucun job n'a besoin de Postgres, la base
# est remplacée par des doubles dans les tests.
name: CI

on:
  push:
    branches: ["main", "J2", "J3"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    name: Tests du jeu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Lancer les tests
        working-directory: frontend
        run: npm test

  scores-api:
    name: Tests de l'API des scores
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scores-api/package-lock.json

      - name: Installer les dépendances
        working-directory: scores-api
        run: npm ci

      - name: Lancer les tests
        working-directory: scores-api
        run: npm test

  stats-api:
    name: Tests du service de stats
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Même version que celle épinglée dans stats_api/Dockerfile
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: stats_api/requirements-dev.txt

      - name: Installer les dépendances
        working-directory: stats_api
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        working-directory: stats_api
        run: python -m pytest -q

  images:
    name: Build des images
    runs-on: ubuntu-latest
    # Inutile de construire les images si le code ne passe pas ses tests
    needs: [frontend, scores-api, stats-api]

    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image du jeu
        run: docker build --tag fastclicker-game:ci .

      - name: Construire l'image de l'API des scores
        run: docker build --tag fastclicker-scores-api:ci scores-api

      - name: Construire l'image du service de stats
        run: docker build --tag fastclicker-stats-api:ci stats_api

      # Le site ne doit contenir que ce qui est servi au navigateur :
      # ni package.json, ni dossier de tests dans l'image.
      - name: Vérifier que l'image du jeu ne contient pas l'outillage de test
        run: |
          contenu=$(docker run --rm --entrypoint sh fastclicker-game:ci -c "ls -A /usr/share/nginx/html")
          echo "$contenu"
          if echo "$contenu" | grep -qE "package.json|tests|node_modules"; then
            echo "::error::l'image du jeu embarque des fichiers de test"
            exit 1
          fi
